# Laboratorio en directo: cada 30 minutos comprueba las señales vencidas, analiza los 14 mercados con el
# mismo motor que la app, apunta las señales de 30 min a 4 h y actualiza el informe de errores en la rama
# «resultados». No opera con dinero: solo apunta y comprueba.
name: Laboratorio en directo

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"  # cada 30 minutos (GitHub puede retrasarlo unos minutos)

permissions:
  contents: write

concurrency:
  group: resultados
  cancel-in-progress: false

jobs:
  laboratorio:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: resultados
          path: resultados
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Comprobar señales vencidas y buscar nuevas
        run: python laboratorio.py --carpeta resultados
      - name: Actualizar el informe
        run: python informe.py resultados/simulacion.csv resultados/vivo.csv --salida resultados/INFORME.md
      - name: Guardar en la rama resultados
        working-directory: resultados
        run: |
          git config user.name "laboratorio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Laboratorio $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
